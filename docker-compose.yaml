services:

  adminer:
    image: adminer:5.4.1
    ports:
      - "8083:8080"
    networks:
      - local-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-net

volumes:
  postgres_data:

networks:
  local-net:
    driver: bridge
