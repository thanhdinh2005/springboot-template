spring:
  datasource:
    #    url: jdbc:h2:mem:testdb
    #    driver-class-name: org.h2.Driver
    #    username: sa
    #    password:

    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatapp_db}?useUnicode=true&amp;characterEncoding=UTF-8&amp;rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #  h2:
  #    console:
  #      enabled: true
  #      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.web.socket.messaging: TRACE

application:
  security:
    jwt:
      secret-key: ${SECRET_KEY}
      expiration: ${TOKEN_EXP}
      refresh-expiration-ms: ${REFRESH_EXP}
